<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Gargantúa">
  <defs>
    <radialGradient id="g-sky" cx="0.76" cy="0.08" r="1.12">
      <stop offset="0" stop-color="#1d2848"/>
      <stop offset="0.4" stop-color="#0a0f1d"/>
      <stop offset="1" stop-color="#04060d"/>
    </radialGradient>
    <radialGradient id="g-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.3" stop-color="#f2c879" stop-opacity="0.24"/>
      <stop offset="0.6" stop-color="#e8a94f" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#e8a94f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-disc" x1="1.4" y1="0" x2="30.6" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffeecb" stop-opacity="0.2"/>
      <stop offset="0.2" stop-color="#fffaf0"/>
      <stop offset="0.46" stop-color="#fffefb"/>
      <stop offset="0.76" stop-color="#f2c879"/>
      <stop offset="1" stop-color="#dd9c48" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="g-bow" x1="6.4" y1="0" x2="25.6" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0bc72" stop-opacity="0"/>
      <stop offset="0.24" stop-color="#fffdf6"/>
      <stop offset="0.52" stop-color="#fff2d6"/>
      <stop offset="0.84" stop-color="#eeb865" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#e8a94f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g-bow-b" x1="7.1" y1="0" x2="24.9" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0bc72" stop-opacity="0"/>
      <stop offset="0.34" stop-color="#fbe6c0" stop-opacity="0.8"/>
      <stop offset="0.68" stop-color="#eab265" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#e8a94f" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="g-tile"><rect width="32" height="32" rx="7"/></clipPath>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#g-sky)"/>

  <g clip-path="url(#g-tile)">
    <circle cx="16" cy="16.1" r="15" fill="url(#g-halo)"/>

    <!-- Sombra del horizonte de sucesos: negro puro, nunca iluminado. -->
    <circle cx="16" cy="16.1" r="6.9" fill="#04060d"/>

    <!-- Cara lejana del disco, curvada por la lente gravitatoria sobre y bajo
         la sombra. Abierta en los costados: si cerrara el circulo, el icono
         leeria como un anillo solido en vez de como luz. -->
    <path d="M6.44 13.53A9.9 9.9 0 0 1 25.56 13.53" fill="none" stroke="url(#g-bow)" stroke-width="3.2" opacity="0.16"/>
    <path d="M6.44 13.53A9.9 9.9 0 0 1 25.56 13.53" fill="none" stroke="url(#g-bow)" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M7.11 19.0A9.35 9.35 0 0 0 24.89 19.0" fill="none" stroke="url(#g-bow-b)" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Disco de acrecion visto de canto: lente gruesa al centro y en punta en
         los extremos. La perspectiva plana es lo que lo separa de un planeta
         anillado. -->
    <path d="M0.9 17.35C8 15.0 24 15.0 31.1 17.35C24 19.7 8 19.7 0.9 17.35Z" fill="url(#g-disc)" opacity="0.2"/>
    <path d="M1.4 17.35C8.4 16.15 23.6 16.15 30.6 17.35C23.6 18.55 8.4 18.55 1.4 17.35Z" fill="url(#g-disc)"/>
  </g>
</svg>
