name: Reporte de error
description: Documenta un comportamiento reproducible del sitio o del repositorio.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Gracias por describir el problema con evidencia reproducible. No incluyas secretos ni datos personales.
  - type: textarea
    id: summary
    attributes:
      label: Resumen
      description: ¿Qué ocurre y qué esperabas que ocurriera?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abre…
        2. Activa…
        3. Observa…
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Ruta
      placeholder: /es/proyectos
  - type: input
    id: environment
    attributes:
      label: Entorno
      description: Navegador, sistema, viewport y dispositivo si aplica.
    validations:
      required: true
  - type: dropdown
    id: effects
    attributes:
      label: Estado de movimiento
      options:
        - Encendido
        - Apagado
        - No aplica
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia
      description: Capturas, vídeo, logs mínimos o traza. Elimina credenciales y datos privados.
  - type: checkboxes
    id: checks
    attributes:
      label: Comprobaciones
      options:
        - label: Busqué issues existentes sobre el mismo problema.
          required: true
        - label: La evidencia no contiene secretos ni datos personales.
          required: true
