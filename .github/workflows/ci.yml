name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un run por rama: cancela runs anteriores en curso al empujar de nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Knip · Tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip
      - run: npm run test
      - run: npm run build
      - name: Verificar build de OpenNext
        run: npx opennextjs-cloudflare build

  e2e:
    name: E2E (Chromium)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Multi-navegador solo en main (plan: Chromium por PR; Firefox/WebKit en main).
  e2e-cross-browser:
    name: E2E (Firefox · WebKit)
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox webkit
      - run: npm run build
      - run: npx playwright test --project=firefox --project=webkit
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-cross-browser
          path: playwright-report/
          retention-days: 7

# Pendientes de CI (ver TODOS.md): Lighthouse perfil ligero (?no3d=1) por PR,
# comprobación de enlaces en main, y job de deploy a Cloudflare cuando existan
# los secrets CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID.
