name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un run por rama: cancela runs anteriores en curso al empujar de nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Knip · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Auditar dependencias
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip
      - run: npm run test
      - run: npm run build
      - name: Verificar build de OpenNext
        run: npx opennextjs-cloudflare build
      - name: Verificar rutas en el Worker real
        run: |
          npx opennextjs-cloudflare preview --port 8787 > /tmp/jonas-orbit-worker.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          if ! npm run test:worker; then
            cat /tmp/jonas-orbit-worker.log
            exit 1
          fi

  e2e:
    name: E2E (Chromium)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Chromium por PR; multinavegador en main o en una validación manual del
  # candidato. El dispatch permite verificar una rama sin desplegarla.
  e2e-cross-browser:
    name: E2E (Firefox · WebKit)
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox webkit
      - run: npm run build
      - run: npx playwright test --project=firefox --project=webkit
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-cross-browser
          path: playwright-report/
          retention-days: 7

  # Perfil LIGERO del plan (?no3d=1): >= 90 en las 4 categorías, LCP < 2.5s.
  # El parámetro es un override explícito del producto, no detección del auditor.
  lighthouse:
    name: Lighthouse (perfil ligero)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Auditar el perfil ligero
        uses: treosh/lighthouse-ci-action@v12
        with:
          # El servidor lo levanta LHCI vía startServerCommand del config.
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
        env:
          # El servidor de producción necesita las claves oficiales de PRUEBA de
          # Turnstile: sin ellas el formulario de Ranger no renderiza y la
          # auditoría de accesibilidad mediría una página incompleta.
          CONTACT_RUNTIME_ENV: test
          CONTACT_DELIVERY_MODE: test
          TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA

  # Criterio de éxito del plan: "cero enlaces rotos". Solo en main para no
  # castigar cada PR con la latencia (y el rate limiting) de hosts externos.
  # También disponible en la validación manual, sin habilitar deploy de ramas.
  links:
    name: Comprobación de enlaces
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Levantar el sitio construido
        run: npm run start &
        env:
          CONTACT_RUNTIME_ENV: test
          CONTACT_DELIVERY_MODE: test
          TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      - name: Esperar al servidor
        # curl en bucle en vez de `npx wait-on`: evita traer una dependencia
        # sin fijar, que chocaría con la política de versiones del repo.
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/es > /dev/null; then
              echo "Servidor listo tras ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "El servidor no respondió en 60s." >&2
          exit 1
      - name: Revisar enlaces del HTML generado
        uses: lycheeverse/lychee-action@v2
        with:
          # --base resuelve los href relativos contra el servidor levantado.
          args: >-
            --base http://localhost:3000
            --no-progress
            --max-concurrency 8
            .next/server/app/**/*.html
          fail: true

  # Deploy a Cloudflare. Se salta solo mientras falten los secrets, para que
  # main no quede en rojo antes de que Jonás elija dominio y cree el proyecto.
  deploy:
    name: Deploy a Cloudflare
    runs-on: ubuntu-latest
    needs: [e2e, e2e-cross-browser, lighthouse, links]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Comprobar que existen los secrets
        id: guard
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] \
            || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] \
            || [ -z "${{ vars.NEXT_PUBLIC_SITE_URL }}" ]; then
            echo "Faltan secrets/vars de despliegue: se omite el deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.ready == 'true'
        run: npm ci
      - if: steps.guard.outputs.ready == 'true'
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Origen canónico: sin él el sitemap y los canonical apuntarían a
          # localhost. lib/site-url.ts rompe el build si el valor es inválido.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
